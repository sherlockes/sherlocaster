<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sherlocaster Config</title>
  <link rel="icon" type="image/jpeg" href="http://homezgz.ddns.net:5005/sherlocaster/artwork.jpg">
  <link rel="stylesheet" href="/static/style.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/dracula.css">

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/yaml/yaml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

</head>

<body>
  <nav>
  <a href="/">Home</a>
  <a href="/config">Cfg</a>
  <a href="/logs">Last</a>
  <a href="/logs/list">All</a>
  <a href="/feed">Feed</a>
</nav>
<hr>


<h1>Config.yaml Editor</h1>

<textarea id="editor"></textarea>

<br><br>

<button onclick="loadConfig()">Reload</button>
<button id="btnSave" onclick="saveConfig()">Save</button>


<div id="status"></div>

<script>
let editor

window.onload = function() {

  editor = CodeMirror.fromTextArea(
    document.getElementById("editor"),
    {
      mode: "yaml",
      theme: "dracula",
      lineNumbers: true
    }
  )

  editor.setSize(null, "80vh")
  editor.on("change", validateYaml)

  loadConfig()
}

function validateYaml() {
  const btn = document.getElementById("btnSave")

  try {
    jsyaml.load(editor.getValue())
    document.getElementById("status").innerText = "YAML OK"
    document.getElementById("status").style.color = "#0f0"
    btn.disabled = false
    return true
  }
  catch(e) {
    document.getElementById("status").innerText = "YAML ERROR: " + e.message
    document.getElementById("status").style.color = "#f55"
    btn.disabled = true
    return false
  }
}


async function loadConfig() {
  document.getElementById("status").innerText = "Loading..."

  const res = await fetch("/api/config")
  const data = await res.json()

  editor.setValue(data.content)
}

async function saveConfig() {

  if (!validateYaml()) return

  const res = await fetch("/api/config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: editor.getValue() })
  })

  if(res.ok) {
    document.getElementById("status").innerText = "Saved OK"
  }
  else {
    const err = await res.json()
    document.getElementById("status").innerText = err.detail
  }
}
</script>

</body>
</html>
