<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sherlocaster - Último log</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    pre {
      background: #000;
      color: #0f0;
      padding: 15px;
      height: 80vh;
      overflow-y: scroll;
      border: 1px solid #333;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
<nav style="margin-bottom: 15px;">
  <a href="/config" style="margin-right: 15px; color:#6cf; text-decoration:none;">Config</a>
  <a href="/logs" style="margin-right: 15px; color:#6cf; text-decoration:none;">Última ejecución</a>
  <a href="/logs/list" style="color:#6cf; text-decoration:none;">Histórico</a>
</nav>
<hr style="border-color:#333; margin-bottom:15px;">


<h1>Última ejecución</h1>
<div id="summary" style="margin-bottom: 10px; color: #aaa; font-family: monospace; white-space: pre-wrap;"></div>

<button onclick="loadLog()">Recargar</button>

<pre id="log">Cargando...</pre>

<script>
async function loadLog() {
  const pre = document.getElementById("log")
  pre.textContent = "Cargando..."

  try {
    const res = await fetch("/api/logs/last")
    const data = await res.json()

    let header = ""
    if (data.filename) header = "Archivo: " + data.filename

    const parsed = parseMeta(data.meta)
    const metaLine = parsed.pretty

    let parts = []

    if (data.filename) {
      parts.push("Archivo: " + data.filename)
    }

    try {
      const parsed = parseMeta(data.meta)
      if (parsed && parsed.pretty) {
	parts.push(parsed.pretty)
      }
    } catch (e) {
      // Si falla el parseo del meta, no rompemos la UI
    }

    if (typeof data.episodes_added === "number") {
      parts.push("Episodios añadidos: " + data.episodes_added)
    }

    document.getElementById("summary").textContent = parts.join(" · ")




    if (!data.content || data.content.trim() === "") {
      pre.textContent = "El log está vacío.\nPuede que la ejecución esté en curso o haya fallado."
    } else {
      pre.textContent = data.content
      pre.scrollTop = pre.scrollHeight
    }

  }
  catch(e) {
    pre.textContent = "Error cargando el log"
  }
}

function parseMeta(metaRaw) {
  if (!metaRaw) return { pretty: "Sin metadata disponible", kv: {} }

  const kv = {}
  const lines = metaRaw.split("\n").map(l => l.trim()).filter(Boolean)

  for (const line of lines) {
    // Soporta: key=value  |  key: value
    let m = line.match(/^([^=:]+)\s*[:=]\s*(.*)$/)
    if (m) {
      const key = m[1].trim()
      const val = m[2].trim()
      kv[key] = val
    }
  }

  // Intentamos construir algo “bonito” si existen claves típicas
  // (si no existen, mostramos el meta completo)
  const candidates = [
    ["start", "Inicio"],
    ["end", "Fin"],
    ["duration", "Duración"],
    ["elapsed", "Duración"],
    ["runtime", "Duración"]
  ]

  let prettyLines = []
  for (const [k, label] of candidates) {
    if (kv[k]) prettyLines.push(`${label}: ${kv[k]}`)
  }

  if (prettyLines.length === 0) {
    // No reconocimos claves -> devolvemos el texto crudo
    return { pretty: metaRaw.trim(), kv }
  }

  return { pretty: prettyLines.join(" · "), kv }
}

  
loadLog()
</script>

</body>
</html>
