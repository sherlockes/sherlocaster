<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sherlocaster - Histórico de logs</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    nav {
      margin-bottom: 15px;
    }

    nav a {
      margin-right: 15px;
      color: #6cf;
      text-decoration: none;
    }

    hr {
      border-color: #333;
      margin-bottom: 15px;
    }

    .log {
      padding: 10px;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 15px;
      align-items: center;
      font-family: monospace;
    }

    .log a {
      color: #6cf;
      text-decoration: none;
    }

    .log .file {
      min-width: 200px;
    }

    .log .episodes {
      color: #9f9;
    }
  </style>
</head>

<body>

<nav>
  <a href="/config">Config</a>
  <a href="/logs">Última ejecución</a>
  <a href="/logs/list">Histórico</a>
</nav>
<hr>

<h1>Histórico de ejecuciones</h1>

<div id="list">Cargando...</div>

<script>
async function loadLogs() {
  const container = document.getElementById("list")
  container.textContent = "Cargando..."

  try {
    const res = await fetch("/api/logs")
    const logs = await res.json()

    if (!logs.length) {
      container.textContent = "No hay logs disponibles"
      return
    }

    container.innerHTML = ""

    for (const log of logs) {
      const div = document.createElement("div")
      div.className = "log"

      const link = document.createElement("a")
      link.href = "/logs?file=" + encodeURIComponent(log.filename)
      link.textContent = log.filename
      link.className = "file"

      const date = document.createElement("span")
      date.textContent = log.date || "-"

      const time = document.createElement("span")
      time.textContent = log.time || "-"

      const eps = document.createElement("span")
      eps.className = "episodes"
      eps.textContent = "Episodios: " + log.episodes_added

      div.appendChild(link)
      div.appendChild(date)
      div.appendChild(time)
      div.appendChild(eps)

      container.appendChild(div)
    }
  }
  catch (e) {
    container.textContent = "Error cargando logs"
  }
}

loadLogs()
</script>

</body>
</html>
