services:
  vpn_tunnel:
    image: linuxserver/wireguard:latest
    container_name: wg_sherlo_tunnel
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./wg_config:/config
    restart: unless-stopped

  sherlocaster:
    build: .
    container_name: sherlocaster
    network_mode: "service:vpn_tunnel"
    depends_on:
      - vpn_tunnel
    env_file:
      - ./config/twitch_token.env
      - ./config/telegram.env
      - ./config/ghtoken.env
    entrypoint:
      - python
      - -m
      - app.main
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/config
      - ./data:/data
      - ./logs:/logs
    environment:
      - PYTHONPATH=/app
      - TZ=Europe/Madrid
    command: python3 -m app.main

  sherlocaster-web:
    build: .
    container_name: sherlocaster-web
    user: root
    entrypoint: []
    command: uvicorn app.web:app --host 0.0.0.0 --port 8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - ./config.yaml:/app/config.yaml
      - ./data:/data
      - ./logs:/logs
    working_dir: /app
    environment:
      - TZ=Europe/Madrid
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
